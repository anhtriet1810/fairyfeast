<title>FairyFeast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@500;800&display=swap">
<style>
  /* Layout: one storybook night stage, letterboxed to 16:9 and centered. Single dark look on purpose. */
  :root {
    --night: #0d0a22;
    --ink: #f3e6c4;
    --gold: #f3d98b;
    --dim: #8f84b8;
    --display: "IM Fell English SC", Georgia, "Times New Roman", serif;
    --ui: "Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--ui);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: min(100%, calc((100dvh - 32px) * 16 / 9));
    max-width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    border-radius: 6px;
    outline: none;
    cursor: pointer;
    image-rendering: pixelated;
  }
  canvas:focus-visible { box-shadow: 0 0 0 3px var(--gold); }
</style>

<canvas id="game" width="1280" height="720" tabindex="0" aria-label="Bubblewood game. A and D aim, Space casts a bubble, B Y P change bubble color."></canvas>

<script>
/* =====================================================================
   FairyFeast
   Controls (keyboard, so the ESP32 encoder and the Pi can drive it):
     A / D        aim left / right  (Left/Right arrows also work)
     SPACE        cast a bubble / start / restart
     B / Y / P    spell: switch bubble color to Blue / Yellow / Pink
   Trap a monster with a bubble of its OWN color. Trapped monsters get
   flung off-screen and knock out any monster they hit on the way.
   ===================================================================== */

/* ---------- YOUR ASSETS ----------
   Paths are relative to this .html file. Anything missing or failing to
   load falls back to the built-in drawing, so you can add art piece by piece.

   Each animation can be EITHER a list of frame files:
       ["assets/wizard_blue_1.png", "assets/wizard_blue_2.png", ...]
   OR one horizontal sprite sheet:
       { sheet: "assets/wizard_blue.png", frames: 4 }

   The frames("prefix", n) helper builds the list prefix1.png ... prefixN.png.
   Rename the paths below to match your files.                              */
const frames = (prefix, n, ext = ".png") => Array.from({ length: n }, (_, i) => `${prefix}${i + 1}${ext}`);

const ASSETS = {
  background: "assets/background.png",        // full screen, 1280x720

  wizard: {                                   // 128x32 sheet = 4 frames of 32x32, loops
    blue:   { sheet: "assets/wizard_blue.png",   frames: 4 },
    yellow: { sheet: "assets/wizard_yellow.png", frames: 4 },
    pink:   { sheet: "assets/wizard_pink.png",   frames: 4 },
  },
  enemy: {                                    // 32x16 sheet = 2 frames of 16x16, loops
    blue:   { sheet: "assets/enemy_blue.png",   frames: 2 },
    yellow: { sheet: "assets/enemy_yellow.png", frames: 2 },
    pink:   { sheet: "assets/enemy_pink.png",   frames: 2 },
  },
  captured: {                                 // 96x16 sheet = 6 frames of 16x16
    blue:   { sheet: "assets/captured_blue.png",   frames: 6 },
    yellow: { sheet: "assets/captured_yellow.png", frames: 6 },
    pink:   { sheet: "assets/captured_pink.png",   frames: 6 },
  },
  spellIcon: {                                // replaces the B / Y / P letters in the spell list
    blue:   "assets/spell_blue.png",
    yellow: "assets/spell_yellow.png",
    pink:   "assets/spell_pink.png",
  },
  bullet: {                                   // single 16x16 image per bubble color
    blue:   "assets/bullet_blue.png",
    yellow: "assets/bullet_yellow.png",
    pink:   "assets/bullet_pink.png",
  },
  music: "assets/music.mp3",                  // background music, loops forever
};

const MUSIC_VOLUME = 0.5;                     // 0 = silent, 1 = full volume

/* Pixel art settings.
   Art sizes: background 192x180, wizard 32x32, enemy / captured / bullet 16x16.
   Everything is drawn at the same whole-number zoom so all pixels match:
   at pixel = 4 the background fills a 768x720 playfield in the middle of the
   1280x720 screen, the wizard is 128x128 and enemies are 64x64.
   The space left and right of the playfield holds the score and spells.   */
const ART = {
  pixel: 4,                            // screen pixels per art pixel (keep it a whole number)
  groundY: 135,                        // row of the BACKGROUND art (0-179) the wizard stands on
  wizard:   { fps: 6 },                // bottom of the 32x32 frame sits on groundY
  enemy:    { fps: 4 },
  captured: { fps: 12, loop: false, spin: false },
                                       // loop false = play once, hold last frame
                                       // spin true  = rotate while flying off (pixels get jagged)
  drawWand: true,                      // draw the aiming wand over your wizard art
};

/* ---------- TUNING ---------- */
const AIM_STEP_DEG    = 6;     // degrees per A/D tap (one encoder click)
const SHOT_COOLDOWN   = 0.22;  // seconds between bubbles
const MAX_BUBBLES     = 4;
const BUBBLE_SPEED    = 900;
const START_HEARTS    = 3;
const ENEMY_SPEED     = 0.6;   // 1 = original speed; lower = slower monsters
const ENEMY_SPEEDUP   = 0.008; // how much faster they get per second survived

/* ===================================================================== */
const W = 1280, H = 720;
const BG_W = 192, BG_H = 180;                       // background art size
const FX0 = Math.round((W - BG_W * ART.pixel) / 2); // playfield left edge  (256 at pixel 4)
const FX1 = FX0 + BG_W * ART.pixel;                 // playfield right edge (1024 at pixel 4)
const GROUND = ART.groundY * ART.pixel;
const PX = W / 2, PY = GROUND;               // player feet
const HAND = { x: PX + 4, y: PY - 78 };      // where bubbles leave the wand
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const COLORS = {
  blue:   { key: "b", main: "#5fb8ff", light: "#d4eeff", dark: "#1d5a98", name: "Blue" },
  yellow: { key: "y", main: "#ffd447", light: "#fff3c2", dark: "#9c7200", name: "Yellow" },
  pink:   { key: "p", main: "#ff6fae", light: "#ffd5e8", dark: "#9e2460", name: "Pink" },
};
const ORDER = ["blue", "yellow", "pink"];
const KEY_TO_COLOR = { b: "blue", y: "yellow", p: "pink" };

/* ---------- asset loading ---------- */
const ready = (im) => im && im.complete && im.naturalWidth > 0;
function loadImg(path) {
  if (!path) return null;
  const im = new Image();
  im.src = path;
  return im;
}
function loadAnim(spec) {
  if (!spec) return null;
  if (typeof spec === "string") spec = [spec];
  if (Array.isArray(spec)) return { list: spec.map(loadImg).filter(Boolean) };
  // frames omitted = assume square frames and count them from the sheet's width
  if (spec.sheet) return { sheet: loadImg(spec.sheet), n: spec.frames || 0 };
  return null;
}
const art = { background: loadImg(ASSETS.background), wizard: {}, enemy: {}, captured: {}, bullet: {}, spell: {} };
for (const c of ORDER) {
  art.spell[c]    = loadImg(ASSETS.spellIcon && ASSETS.spellIcon[c]);
  art.wizard[c]   = loadAnim(ASSETS.wizard && ASSETS.wizard[c]);
  art.enemy[c]    = loadAnim(ASSETS.enemy && ASSETS.enemy[c]);
  art.captured[c] = loadAnim(ASSETS.captured && ASSETS.captured[c]);
  art.bullet[c]   = loadAnim(ASSETS.bullet && ASSETS.bullet[c]);
}

/* Draws one frame of an animation. Returns false (so the built-in drawing
   is used instead) when none of its images have loaded.
   t = seconds since the animation started; anchor "bottom" puts the feet at y. */
function animReady(anim) {
  if (!anim) return false;
  return anim.sheet ? ready(anim.sheet) : anim.list.some(ready);
}
function drawAnim(anim, t, fps, x, y, scale, { anchor = "center", loop = true } = {}) {
  if (!anim) return false;
  let im, sx = 0, sw, sh, count;
  if (anim.sheet) {
    if (!ready(anim.sheet)) return false;
    im = anim.sheet;
    count = anim.n || Math.max(1, Math.round(im.naturalWidth / im.naturalHeight));
    sw = im.naturalWidth / count; sh = im.naturalHeight;
  } else {
    const ok = anim.list.filter(ready);
    if (!ok.length) return false;
    count = ok.length;
    im = null;
    anim._ok = ok;
  }
  let i = Math.floor(t * (fps || 0));
  i = loop ? i % count : Math.min(i, count - 1);
  if (anim.sheet) sx = i * sw;
  else { im = anim._ok[i]; sw = im.naturalWidth; sh = im.naturalHeight; }
  const w = Math.round(sw * scale), h = Math.round(sh * scale);
  const left = Math.round(x - w / 2);
  const top = Math.round(anchor === "bottom" ? y - h : y - h / 2);
  ctx.imageSmoothingEnabled = false;   // crisp pixel art
  ctx.drawImage(im, sx, 0, sw, sh, left, top, w, h);
  return true;
}
/* ---------- music ----------
   Loops the mp3 forever. Browsers only allow sound after the player presses
   something, so it tries to start right away (works in kiosk mode with the
   autoplay flag) and otherwise starts on the first key press or click.    */
let music = null;
if (ASSETS.music) {
  music = new Audio(ASSETS.music);
  music.loop = true;
  music.preload = "auto";
  music.volume = MUSIC_VOLUME;
  music.addEventListener("error", () => { music = null; });   // missing file: play silently
  music.play().catch(() => {});                               // try autoplay
}

/* ---------- sound (synthesized, starts after first key) ---------- */
let actx = null;
function audioOn() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  if (music && music.paused) music.play().catch(() => {});
}
function tone(f1, f2, dur, type = "sine", vol = 0.18, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  shoot: () => tone(520, 880, 0.12, "sine", 0.14),
  trap:  () => { tone(660, 990, 0.1, "triangle", 0.16); tone(990, 1320, 0.12, "triangle", 0.12, 0.08); },
  fling: () => tone(300, 1200, 0.25, "sine", 0.1),
  knock: () => tone(880, 1760, 0.08, "square", 0.06),
  wrong: () => tone(260, 140, 0.18, "sawtooth", 0.08),
  hurt:  () => { tone(180, 60, 0.4, "sawtooth", 0.16); },
  spell: () => { [784, 988, 1175].forEach((f, i) => tone(f, f * 1.01, 0.18, "sine", 0.1, i * 0.05)); },
  start: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.2, "triangle", 0.12, i * 0.09)); },
  over:  () => { [523, 440, 349, 262].forEach((f, i) => tone(f, f * 0.98, 0.35, "triangle", 0.12, i * 0.18)); },
};

/* ---------- state ---------- */
let best = 0;
try { best = parseInt(localStorage.getItem("bubblewood-best") || "0", 10) || 0; } catch (e) {}

const g = {
  mode: "title", t: 0, elapsed: 0, score: 0, hearts: START_HEARTS, combo: 0,
  color: "blue", aim: -Math.PI / 2, cooldown: 0, spawnT: 1.2, overT: 0,
  shake: 0, spellFlash: 0, hurtFlash: 0,
  enemies: [], bubbles: [], parts: [], floaters: [],
};
const AIM_MIN = -Math.PI + 0.2, AIM_MAX = -0.2;
const rand = (a, b) => a + Math.random() * (b - a);

function resetGame() {
  Object.assign(g, {
    mode: "play", elapsed: 0, score: 0, hearts: START_HEARTS, combo: 0,
    aim: -Math.PI / 2, cooldown: 0, spawnT: 1.0, shake: 0, hurtFlash: 0,
    enemies: [], bubbles: [], parts: [], floaters: [],
  });
  sfx.start();
}

/* ---------- input ---------- */
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if ([" ", "a", "d", "b", "y", "p", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
  audioOn();

  if (k === "a" || k === "arrowleft")  g.aim = Math.max(AIM_MIN, g.aim - AIM_STEP_DEG * Math.PI / 180);
  if (k === "d" || k === "arrowright") g.aim = Math.min(AIM_MAX, g.aim + AIM_STEP_DEG * Math.PI / 180);

  if (KEY_TO_COLOR[k] && !e.repeat) castSpell(KEY_TO_COLOR[k]);

  if (k === " " && !e.repeat) {
    if (g.mode === "title") resetGame();
    else if (g.mode === "over" && g.overT > 1.2) resetGame();
    else if (g.mode === "play") shoot();
  }
});
canvas.addEventListener("pointerdown", () => { canvas.focus(); audioOn(); });
window.addEventListener("load", () => canvas.focus());

function castSpell(color) {
  if (g.color === color) { g.spellFlash = 0.4; return; }
  g.color = color;
  g.spellFlash = 1;
  sfx.spell();
  const c = COLORS[color];
  g.parts.push({ kind: "ring", x: PX, y: PY - 60, r: 20, vr: 520, life: 0.5, max: 0.5, color: c.main });
  for (let i = 0; i < 18; i++) {
    const a = rand(0, Math.PI * 2), s = rand(120, 320);
    g.parts.push({ kind: "spark", x: PX, y: PY - 60, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.8), max: 0.8, color: c.light, size: rand(2, 4) });
  }
}

function shoot() {
  if (g.cooldown > 0 || g.bubbles.length >= MAX_BUBBLES) return;
  g.cooldown = SHOT_COOLDOWN;
  const tip = wandTip();
  g.bubbles.push({ x: tip.x, y: tip.y, vx: Math.cos(g.aim) * BUBBLE_SPEED, vy: Math.sin(g.aim) * BUBBLE_SPEED, r: 24, color: g.color, wob: rand(0, 6) });
  sfx.shoot();
}
function wandTip() { return { x: HAND.x + Math.cos(g.aim) * 50, y: HAND.y + Math.sin(g.aim) * 50 }; }

/* ---------- spawning ---------- */
function spawnEnemy() {
  const batChance = Math.min(0.45, 0.1 + g.elapsed * 0.006);
  const type = Math.random() < batChance ? "bat" : "imp";
  const speedMul = ENEMY_SPEED * (1 + g.elapsed * ENEMY_SPEEDUP);
  const x = rand(FX0 + 70, FX1 - 70);
  g.enemies.push({
    type, color: ORDER[Math.floor(Math.random() * 3)],
    x, baseX: x, y: -50, r: type === "bat" ? 26 : 30,
    vy: (type === "bat" ? rand(85, 115) : rand(45, 70)) * speedMul,
    amp: type === "bat" ? rand(50, 110) : rand(10, 30),
    freq: type === "bat" ? rand(1.8, 2.6) : rand(1, 1.6),
    ph: rand(0, 6.28), t: 0, state: "walk", rot: 0, spin: 0, vx: 0, shakeT: 0,
  });
}

/* ---------- helpers ---------- */
function burst(x, y, color, n = 14, speed = 260) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(speed * 0.3, speed);
    g.parts.push({ kind: "spark", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7, color, size: rand(2, 4.5) });
  }
}
function floater(x, y, text, color) { g.floaters.push({ x, y, text, color, life: 1.1 }); }
function addShake(a) { if (!reduceMotion) g.shake = Math.max(g.shake, a); }

function fling(e, dir, vy, chain) {
  e.state = "flung";
  if (e.capturedAt == null) e.capturedAt = g.t;
  e.vx = dir * rand(650, 850);
  e.vy = vy;
  e.spin = dir * rand(8, 14);
  e.chain = chain;
}

/* ---------- update ---------- */
function update(dt) {
  g.t += dt;
  g.shake = Math.max(0, g.shake - dt * 30);
  g.spellFlash = Math.max(0, g.spellFlash - dt * 2.5);
  g.hurtFlash = Math.max(0, g.hurtFlash - dt * 2);

  if (g.mode === "over") g.overT += dt;

  if (g.mode === "play") {
    g.elapsed += dt;
    g.cooldown = Math.max(0, g.cooldown - dt);

    g.spawnT -= dt;
    if (g.spawnT <= 0) {
      spawnEnemy();
      g.spawnT = Math.max(0.55, 1.9 - g.elapsed * 0.022) * rand(0.75, 1.25);
    }

    // bubbles
    for (const b of g.bubbles) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.wob += dt * 10;
      if (b.x < FX0 + b.r) { b.x = FX0 + b.r; b.vx = Math.abs(b.vx); }
      if (b.x > FX1 - b.r) { b.x = FX1 - b.r; b.vx = -Math.abs(b.vx); }
      if (b.y < -b.r * 2) b.dead = true;
      if (b.dead) continue;
      for (const e of g.enemies) {
        if (e.state !== "walk") continue;
        const dx = e.x - b.x, dy = e.y - b.y;
        if (dx * dx + dy * dy < (e.r + b.r) ** 2) {
          b.dead = true;
          if (e.color === b.color) {
            e.state = "trapped"; e.t2 = 0; e.capturedAt = g.t;
            e.flingDir = Math.abs(b.vx) > 60 ? Math.sign(b.vx) : (Math.random() < 0.5 ? -1 : 1);
            g.combo++;
            const mult = 1 + Math.floor(g.combo / 5);
            const pts = 100 * mult;
            g.score += pts;
            floater(e.x, e.y - 40, mult > 1 ? `+${pts}  x${mult}` : `+${pts}`, COLORS[e.color].light);
            burst(e.x, e.y, COLORS[e.color].light, 12, 200);
            sfx.trap();
          } else {
            e.y -= 22; e.shakeT = 0.3;
            g.combo = 0;
            floater(e.x, e.y - 44, `needs ${COLORS[e.color].name}`, COLORS[e.color].main);
            burst(b.x, b.y, COLORS[b.color].light, 8, 140);
            sfx.wrong();
          }
          break;
        }
      }
    }
  }

  // enemies (keep animating on the end screen so flung ones finish)
  const speedPause = g.mode === "play" ? 1 : 0;
  for (const e of g.enemies) {
    e.t += dt;
    e.shakeT = Math.max(0, e.shakeT - dt);
    if (e.state === "walk") {
      e.y += e.vy * dt * speedPause;
      e.x = e.baseX + Math.sin(e.t * e.freq + e.ph) * e.amp;
      e.x = Math.min(FX1 - 34, Math.max(FX0 + 34, e.x));
      if (e.y > GROUND - 24 && g.mode === "play") {
        e.dead = true;
        g.hearts--; g.combo = 0; g.hurtFlash = 1;
        addShake(14);
        burst(e.x, e.y, "#ff8a7a", 22, 320);
        sfx.hurt();
        if (g.hearts <= 0) gameOver();
      }
    } else if (e.state === "trapped") {
      e.t2 += dt;
      e.y -= 70 * dt;
      if (e.t2 > 0.32) { fling(e, e.flingDir, -460, 0); sfx.fling(); }
    } else if (e.state === "flung") {
      e.vy += 950 * dt;
      e.x += e.vx * dt; e.y += e.vy * dt; e.rot += e.spin * dt;
      if (Math.random() < 0.6) g.parts.push({ kind: "spark", x: e.x, y: e.y, vx: rand(-40, 40), vy: rand(-40, 40), life: 0.4, max: 0.4, color: COLORS[e.color].light, size: 2.5 });
      // knock out any monster in the way, any color
      if (g.mode === "play") {
        for (const o of g.enemies) {
          if (o === e || o.state !== "walk") continue;
          const dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy < (o.r + e.r + 12) ** 2) {
            const chain = (e.chain || 0) + 1;
            fling(o, Math.sign(e.vx) || 1, -380, chain);
            const pts = 150 * chain;
            g.score += pts;
            floater(o.x, o.y - 40, `KNOCKOUT +${pts}`, "#ffffff");
            burst(o.x, o.y, "#ffffff", 16, 300);
            addShake(6);
            sfx.knock();
          }
        }
      }
      if (e.x < FX0 - 80 || e.x > FX1 + 80 || e.y > H + 100) e.dead = true;
    }
  }

  // particles & floaters
  for (const p of g.parts) {
    p.life -= dt;
    if (p.kind === "spark") { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy = p.vy * 0.96 + 60 * dt; }
    else if (p.kind === "ring") p.r += p.vr * dt;
  }
  for (const f of g.floaters) { f.life -= dt; f.y -= 40 * dt; }

  g.bubbles = g.bubbles.filter((b) => !b.dead);
  g.enemies = g.enemies.filter((e) => !e.dead);
  g.parts = g.parts.filter((p) => p.life > 0);
  g.floaters = g.floaters.filter((f) => f.life > 0);
}

function gameOver() {
  g.mode = "over"; g.overT = 0;
  if (g.score > best) { best = g.score; try { localStorage.setItem("bubblewood-best", String(best)); } catch (e) {} }
  sfx.over();
}

/* ---------- background (drawn once) ---------- */
const bg = document.createElement("canvas");
bg.width = W; bg.height = H;
(function paintBackground() {
  const b = bg.getContext("2d");
  const sky = b.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, "#0e0b28"); sky.addColorStop(0.55, "#251c58"); sky.addColorStop(1, "#4b3478");
  b.fillStyle = sky; b.fillRect(0, 0, W, H);

  // moon
  const mg = b.createRadialGradient(1050, 120, 10, 1050, 120, 180);
  mg.addColorStop(0, "rgba(255,240,200,0.45)"); mg.addColorStop(1, "rgba(255,240,200,0)");
  b.fillStyle = mg; b.fillRect(850, 0, 400, 320);
  b.fillStyle = "#fff3d4"; b.beginPath(); b.arc(1050, 120, 52, 0, Math.PI * 2); b.fill();
  b.fillStyle = "rgba(220,200,160,0.35)";
  [[1035, 105, 10], [1068, 132, 7], [1040, 145, 5]].forEach(([x, y, r]) => { b.beginPath(); b.arc(x, y, r, 0, 7); b.fill(); });

  // far hills
  b.fillStyle = "#2a2160";
  b.beginPath(); b.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 20) b.lineTo(x, 520 + Math.sin(x * 0.006) * 34 + Math.sin(x * 0.017) * 12);
  b.lineTo(W, GROUND); b.fill();

  // castle on the far hill
  b.fillStyle = "#1b1546";
  const cx = 230, cy = 510;
  b.fillRect(cx - 70, cy - 70, 140, 80);
  [[-70, 26, 130], [44, 26, 120], [-16, 32, 160]].forEach(([dx, w, h]) => {
    b.fillRect(cx + dx, cy - h + 10, w, h);
    b.beginPath(); b.moveTo(cx + dx - 6, cy - h + 10); b.lineTo(cx + dx + w / 2, cy - h - 34); b.lineTo(cx + dx + w + 6, cy - h + 10); b.fill();
  });
  b.fillStyle = "#ffd98a";
  [[cx - 60, cy - 90], [cx + 54, cy - 80], [cx - 4, cy - 120], [cx + 4, cy - 40]].forEach(([x, y]) => b.fillRect(x, y, 7, 11));

  // near hills
  b.fillStyle = "#18123d";
  b.beginPath(); b.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 20) b.lineTo(x, 588 + Math.sin(x * 0.009 + 1) * 26);
  b.lineTo(W, GROUND); b.fill();

  // trees
  b.fillStyle = "#110d2e";
  for (const tx of [60, 120, 470, 860, 930, 1190, 1240]) {
    const th = 70 + (tx % 50);
    b.beginPath(); b.moveTo(tx - 26, GROUND); b.lineTo(tx, GROUND - th - 40); b.lineTo(tx + 26, GROUND); b.fill();
  }

  // ground
  b.fillStyle = "#0f0b26"; b.fillRect(0, GROUND, W, H - GROUND);
  b.fillStyle = "#2f5d55"; b.fillRect(0, GROUND, W, 5);
  b.fillStyle = "#3f7a6c";
  for (let x = 0; x < W; x += 9) b.fillRect(x, GROUND - 3 - (x * 7 % 5), 3, 4 + (x * 7 % 5));
})();
const stars = Array.from({ length: 90 }, () => ({ x: rand(0, W), y: rand(0, 470), r: rand(0.6, 1.8), ph: rand(0, 6.28) }));

/* ---------- drawing ---------- */
function drawBackground() {
  if (ready(art.background)) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(art.background, FX0, 0, BG_W * ART.pixel, BG_H * ART.pixel);
    return;
  }
  ctx.drawImage(bg, 0, 0);
  ctx.fillStyle = "#fff6dc";
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(g.t * 2 + s.ph));
    ctx.fillRect(s.x, s.y, s.r * 1.6, s.r * 1.6);
  }
  ctx.globalAlpha = 1;
}

function drawAimGuide() {
  const c = COLORS[g.color];
  const tip = wandTip();
  let x = tip.x, y = tip.y, vx = Math.cos(g.aim), vy = Math.sin(g.aim);
  for (let i = 0; i < 16; i++) {
    x += vx * 24; y += vy * 24;
    if (x < FX0 + 10) { x = FX0 + 10; vx = Math.abs(vx); }
    if (x > FX1 - 10) { x = FX1 - 10; vx = -Math.abs(vx); }
    ctx.globalAlpha = 0.75 * (1 - i / 16);
    ctx.fillStyle = c.light;
    ctx.beginPath(); ctx.arc(x, y, 3.2 - i * 0.12, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const c = COLORS[g.color];
  const bob = Math.sin(g.t * 3) * 2;
  const usedArt = drawAnim(art.wizard[g.color], g.t, ART.wizard.fps, PX, PY, ART.pixel, { anchor: "bottom" });
  if (!usedArt) {
    // robe
    ctx.fillStyle = "#3a2a72";
    ctx.beginPath(); ctx.moveTo(PX - 38, PY); ctx.quadraticCurveTo(PX, PY - 96 + bob, PX + 38, PY); ctx.fill();
    ctx.fillStyle = "#4c3a92";
    ctx.beginPath(); ctx.moveTo(PX - 14, PY); ctx.lineTo(PX, PY - 60 + bob); ctx.lineTo(PX + 14, PY); ctx.fill();
    // face
    ctx.fillStyle = "#f4d4b2";
    ctx.beginPath(); ctx.arc(PX, PY - 88 + bob, 17, 0, 7); ctx.fill();
    ctx.fillStyle = "#2a1d4a";
    ctx.beginPath(); ctx.arc(PX - 6, PY - 89 + bob, 2.2, 0, 7); ctx.arc(PX + 6, PY - 89 + bob, 2.2, 0, 7); ctx.fill();
    ctx.fillStyle = "#e89aa0";
    ctx.beginPath(); ctx.arc(PX - 10, PY - 83 + bob, 3, 0, 7); ctx.arc(PX + 10, PY - 83 + bob, 3, 0, 7); ctx.fill();
    // hat in the current spell color
    ctx.fillStyle = c.dark;
    ctx.beginPath(); ctx.ellipse(PX, PY - 101 + bob, 30, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = c.main;
    ctx.beginPath(); ctx.moveTo(PX - 20, PY - 102 + bob); ctx.quadraticCurveTo(PX + 4, PY - 150 + bob, PX + 26, PY - 160 + bob); ctx.lineTo(PX + 18, PY - 102 + bob); ctx.fill();
    ctx.fillStyle = "#fff6dc";
    star(PX + 2, PY - 122 + bob, 5);
  }
  if (usedArt && !ART.drawWand) return;
  // wand
  const tip = wandTip();
  ctx.strokeStyle = "#c69a5a"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(HAND.x, HAND.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  const glow = 8 + Math.sin(g.t * 8) * 2 + g.spellFlash * 10;
  ctx.fillStyle = c.light;
  ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(tip.x, tip.y, glow * 1.8, 0, 7); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = "#ffffff"; star(tip.x, tip.y, 7);
}

function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.fill();
}

function drawBubble(x, y, r, color, wob = 0) {
  const c = COLORS[color];
  const rx = r * (1 + Math.sin(wob) * 0.05), ry = r * (1 - Math.sin(wob) * 0.05);
  const gr = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  gr.addColorStop(0, "rgba(255,255,255,0.55)");
  gr.addColorStop(0.5, hexA(c.main, 0.22));
  gr.addColorStop(1, hexA(c.main, 0.55));
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = hexA(c.light, 0.9); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath(); ctx.ellipse(x - r * 0.38, y - r * 0.42, r * 0.18, r * 0.1, -0.6, 0, 7); ctx.fill();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function drawMonster(e, x, y, scale) {
  const c = COLORS[e.color];
  if (drawAnim(art.enemy[e.color], e.t + e.ph, ART.enemy.fps, x, y, ART.pixel * scale)) return;
  const r = e.r * scale;
  const look = Math.atan2(PY - 80 - y, PX - x);
  if (e.type === "bat") {
    const flap = Math.sin(e.t * 14) * 0.6;
    ctx.fillStyle = c.dark;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + s * r * 0.5, y);
      ctx.lineTo(x + s * r * 2.1, y - r * (0.6 + flap));
      ctx.lineTo(x + s * r * 1.7, y + r * 0.2);
      ctx.lineTo(x + s * r * 1.3, y - r * 0.05);
      ctx.lineTo(x + s * r * 0.9, y + r * 0.35);
      ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(x - r * 0.6, y - r * 0.6); ctx.lineTo(x - r * 0.35, y - r * 1.2); ctx.lineTo(x - r * 0.05, y - r * 0.7);
    ctx.moveTo(x + r * 0.6, y - r * 0.6); ctx.lineTo(x + r * 0.35, y - r * 1.2); ctx.lineTo(x + r * 0.05, y - r * 0.7); ctx.fill();
  } else {
    // horns + feet
    ctx.fillStyle = c.dark;
    ctx.beginPath(); ctx.moveTo(x - r * 0.75, y - r * 0.5); ctx.lineTo(x - r * 0.95, y - r * 1.35); ctx.lineTo(x - r * 0.3, y - r * 0.85);
    ctx.moveTo(x + r * 0.75, y - r * 0.5); ctx.lineTo(x + r * 0.95, y - r * 1.35); ctx.lineTo(x + r * 0.3, y - r * 0.85); ctx.fill();
    const step = Math.sin(e.t * 8) * r * 0.15;
    ctx.beginPath(); ctx.ellipse(x - r * 0.4, y + r * 0.95 + step, r * 0.3, r * 0.16, 0, 0, 7);
    ctx.ellipse(x + r * 0.4, y + r * 0.95 - step, r * 0.3, r * 0.16, 0, 0, 7); ctx.fill();
  }
  // body
  const bodyR = e.type === "bat" ? r * 0.85 : r;
  const gr = ctx.createRadialGradient(x - bodyR * 0.3, y - bodyR * 0.4, bodyR * 0.1, x, y, bodyR);
  gr.addColorStop(0, c.light); gr.addColorStop(0.45, c.main); gr.addColorStop(1, c.dark);
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(x, y, bodyR, 0, 7); ctx.fill();
  // eyes look at the witch
  const ex = Math.cos(look) * bodyR * 0.08, ey = Math.sin(look) * bodyR * 0.08;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.ellipse(x - bodyR * 0.34, y - bodyR * 0.1, bodyR * 0.24, bodyR * 0.3, 0, 0, 7);
  ctx.ellipse(x + bodyR * 0.34, y - bodyR * 0.1, bodyR * 0.24, bodyR * 0.3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#1a1030";
  ctx.beginPath(); ctx.arc(x - bodyR * 0.34 + ex, y - bodyR * 0.06 + ey, bodyR * 0.12, 0, 7);
  ctx.arc(x + bodyR * 0.34 + ex, y - bodyR * 0.06 + ey, bodyR * 0.12, 0, 7); ctx.fill();
  // grumpy brows + fang mouth
  ctx.strokeStyle = "#1a1030"; ctx.lineWidth = Math.max(2, bodyR * 0.08); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - bodyR * 0.55, y - bodyR * 0.48); ctx.lineTo(x - bodyR * 0.15, y - bodyR * 0.36);
  ctx.moveTo(x + bodyR * 0.55, y - bodyR * 0.48); ctx.lineTo(x + bodyR * 0.15, y - bodyR * 0.36); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y + bodyR * 0.32, bodyR * 0.22, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.moveTo(x - bodyR * 0.12, y + bodyR * 0.48); ctx.lineTo(x - bodyR * 0.06, y + bodyR * 0.62); ctx.lineTo(x, y + bodyR * 0.5); ctx.fill();
}

function drawEnemies() {
  for (const e of g.enemies) {
    const jitter = e.shakeT > 0 ? Math.sin(e.t * 80) * 4 : 0;
    if (e.state === "walk") {
      drawMonster(e, e.x + jitter, e.y, 1);
    } else {
      ctx.save();
      ctx.translate(e.x, e.y);
      const capArt = animReady(art.captured[e.color]);
      if (!capArt || ART.captured.spin) ctx.rotate(e.rot);
      const usedArt = drawAnim(art.captured[e.color], g.t - (e.capturedAt || g.t), ART.captured.fps, 0, 0,
                               ART.pixel, { loop: ART.captured.loop });
      if (!usedArt) drawMonster(e, 0, 0, 0.72);
      ctx.restore();
      if (!usedArt) drawBubble(e.x, e.y, e.r + 12, e.color, e.t * 8);
    }
  }
}

function drawParticles() {
  for (const p of g.parts) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    if (p.kind === "ring") {
      ctx.strokeStyle = p.color; ctx.lineWidth = 4 * a + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  ctx.textAlign = "center";
  ctx.font = "800 24px 'Alegreya Sans', 'Trebuchet MS', sans-serif";
  for (const f of g.floaters) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.fillStyle = "rgba(10,6,30,0.7)"; ctx.fillText(f.text, f.x + 2, f.y + 2);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function heart(x, y, s, filled) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y - s * 0.2, x - s, y - s * 0.2, x - s, y + s * 0.3);
  ctx.bezierCurveTo(x - s, y + s * 0.75, x, y + s, x, y + s * 1.25);
  ctx.bezierCurveTo(x, y + s, x + s, y + s * 0.75, x + s, y + s * 0.3);
  ctx.bezierCurveTo(x + s, y - s * 0.2, x, y - s * 0.2, x, y + s * 0.3);
  ctx.fillStyle = filled ? "#ff5d7a" : "rgba(255,255,255,0.14)";
  ctx.fill();
  if (filled) { ctx.strokeStyle = "#ffd0da"; ctx.lineWidth = 2; ctx.stroke(); }
}

/* The margins left and right of the playfield, like a storybook's border. */
function drawFrame() {
  ctx.fillStyle = "#130e30";
  ctx.fillRect(0, 0, FX0, H);
  ctx.fillRect(FX1, 0, W - FX1, H);
  ctx.fillStyle = "rgba(243,217,139,0.07)";
  for (let y = 24; y < H; y += 48) {
    for (const x of [FX0 / 2 - 90, FX0 / 2 + 90, FX1 + (W - FX1) / 2 - 90, FX1 + (W - FX1) / 2 + 90]) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.fillRect(-4, -4, 8, 8); ctx.restore();
    }
  }
  ctx.strokeStyle = "#c9a85a"; ctx.lineWidth = 4;
  ctx.strokeRect(FX0 - 2, -4, FX1 - FX0 + 4, H + 8);
  ctx.strokeStyle = "rgba(201,168,90,0.35)"; ctx.lineWidth = 1;
  ctx.strokeRect(FX0 - 10, -4, FX1 - FX0 + 20, H + 8);
}

function label(text, x, y) {
  ctx.textAlign = "center";
  ctx.font = "800 16px 'Alegreya Sans', 'Trebuchet MS', sans-serif";
  ctx.fillStyle = "#8f84b8";
  if ("letterSpacing" in ctx) ctx.letterSpacing = "4px";
  ctx.fillText(text, x, y);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}

function drawHUD() {
  const lx = FX0 / 2, rx = FX1 + (W - FX1) / 2;
  const ui = (w, s) => `${w} ${s}px 'Alegreya Sans', 'Trebuchet MS', sans-serif`;

  // left margin: hearts and spells
  label("LIVES", lx, 70);
  for (let i = 0; i < START_HEARTS; i++) heart(lx - 52 + i * 52, 92, 17, i < g.hearts);

  label("SPELLS", lx, 230);
  ORDER.forEach((name, i) => {
    const c = COLORS[name], y = 290 + i * 84, active = g.color === name;
    const r = active ? 28 + g.spellFlash * 6 : 22;
    const cx = lx - 40;
    ctx.fillStyle = hexA(c.main, active ? 0.95 : 0.3);
    ctx.beginPath(); ctx.arc(cx, y, r, 0, 7); ctx.fill();
    if (active) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.stroke(); }
    const icon = art.spell[name];
    if (ready(icon)) {
      // whole-number zoom so the pixel art stays crisp; bigger when selected
      const target = active ? 48 : 36;
      const s = Math.max(1, Math.floor(target / Math.max(icon.naturalWidth, icon.naturalHeight)));
      const w = icon.naturalWidth * s, h = icon.naturalHeight * s;
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = active ? 1 : 0.55;
      ctx.drawImage(icon, Math.round(cx - w / 2), Math.round(y - h / 2), w, h);
      ctx.globalAlpha = 1;
    } else {
      ctx.textAlign = "center";
      ctx.font = ui(800, active ? 26 : 20);
      ctx.fillStyle = active ? "#1a1030" : "rgba(255,255,255,0.75)";
      ctx.fillText(c.key.toUpperCase(), cx, y + (active ? 9 : 7));
    }
    ctx.textAlign = "left";
    ctx.font = ui(active ? 800 : 500, 22);
    ctx.fillStyle = active ? c.light : "rgba(233,221,255,0.5)";
    ctx.fillText(c.name, cx + 40, y + 8);
  });

  // right margin: score, best, combo
  label("SCORE", rx, 70);
  ctx.textAlign = "center";
  ctx.font = ui(800, 44);
  ctx.fillStyle = "#f3d98b";
  ctx.fillText(g.score.toLocaleString(), rx, 122);

  label("BEST", rx, 190);
  ctx.font = ui(500, 26);
  ctx.fillStyle = "#e9ddff";
  ctx.fillText(best.toLocaleString(), rx, 226);

  label("COMBO", rx, 310);
  const mult = 1 + Math.floor(g.combo / 5);
  ctx.font = ui(800, 40);
  ctx.fillStyle = g.combo >= 3 ? COLORS[g.color].light : "rgba(233,221,255,0.35)";
  ctx.fillText(String(g.combo), rx, 362);
  if (mult > 1) {
    ctx.font = ui(800, 24);
    ctx.fillStyle = "#f3d98b";
    ctx.fillText(`x${mult} points`, rx, 398);
  }
}

function panel(title, lines, prompt) {
  ctx.fillStyle = "rgba(9,6,26,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.font = "92px 'IM Fell English SC', Georgia, serif";
  ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillText(title, W / 2 + 4, 214);
  ctx.fillStyle = "#f3d98b"; ctx.fillText(title, W / 2, 210);
  ctx.font = "500 26px 'Alegreya Sans', 'Trebuchet MS', sans-serif";
  lines.forEach((l, i) => {
    ctx.fillStyle = l.color || "#e9ddff";
    ctx.fillText(l.text, W / 2, 282 + i * 40);
  });
  if (prompt) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(g.t * 4);
    ctx.font = "800 32px 'Alegreya Sans', 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText(prompt, W / 2, 282 + lines.length * 40 + 60);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.save();
  if (g.shake > 0) ctx.translate(rand(-g.shake, g.shake), rand(-g.shake, g.shake));
  drawBackground();
  if (g.mode === "play") drawAimGuide();
  drawEnemies();
  for (const b of g.bubbles) {
    if (!drawAnim(art.bullet[b.color], 0, 0, b.x, b.y, ART.pixel)) drawBubble(b.x, b.y, b.r, b.color, b.wob);
  }
  drawPlayer();
  drawParticles();
  drawFloaters();
  ctx.restore();

  if (g.hurtFlash > 0) {
    ctx.fillStyle = `rgba(255,60,90,${g.hurtFlash * 0.25})`;
    ctx.fillRect(FX0, 0, FX1 - FX0, H);
  }

  drawFrame();

  if (g.mode === "play") drawHUD();
  if (g.mode === "title") {
    panel("FairyFeast", [
      { text: "As the winter comes, the fairies are approaching the wizard's garden." },
      { text: "Help the wizard trap all of the fairies into bubbles!" },
      { text: "Turn the dial to aim.  Press it to cast a bubble." },
      { text: "Draw different spells to change your bubble's color.", color: "#f3d98b" },
      { text: "Trap each monster with a bubble of its own color." },
    ], "Press the dial to begin");
    if (best > 0) {
      ctx.font = "500 20px 'Alegreya Sans', 'Trebuchet MS', sans-serif";
      ctx.fillStyle = "#a99fd0"; ctx.textAlign = "center";
      ctx.fillText(`Best score ${best.toLocaleString()}`, W / 2, H - 40);
    }
  }
  if (g.mode === "over") {
    panel("The End", [
      { text: `Score  ${g.score.toLocaleString()}`, color: "#ffffff" },
      { text: g.score >= best && g.score > 0 ? "A new best tale!" : `Best  ${best.toLocaleString()}`, color: "#f3d98b" },
    ], g.overT > 1.2 ? "Press the dial to play again" : "");
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));
</script>
